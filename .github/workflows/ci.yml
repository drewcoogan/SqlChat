name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SqlChat.sln

      - name: Build
        run: dotnet build SqlChat.sln -c Release --no-restore

      # Integration tests need live databases and API keys; they are excluded here.
      - name: Test
        run: dotnet test SqlChat.sln -c Release --no-build --filter "FullyQualifiedName!~Integration"

      # Catches packaging problems (missing README, bad metadata) before a release tag is pushed.
      - name: Pack (dry run)
        run: dotnet pack SqlChat.sln -c Release --no-build -o ./nupkgs
