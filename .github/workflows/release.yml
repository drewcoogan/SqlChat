name: Release

# To release: bump <Version> in Directory.Build.props, commit, then
#   git tag v<version> && git push origin v<version>
# Publishes via nuget.org Trusted Publishing (OIDC): no long-lived API key is stored.
# Requires a nuget.org trusted publishing policy for drewcoogan/SqlChat, workflow release.yml,
# environment nuget, and the secret NUGET_USER (nuget.org profile name, not email) on the nuget environment.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub Release
  id-token: write   # request the GitHub OIDC token that nuget.org exchanges for a temporary API key

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROPS_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          echo "Tag: $TAG_VERSION  Directory.Build.props: $PROPS_VERSION"
          if [ "$TAG_VERSION" != "$PROPS_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match <Version>$PROPS_VERSION</Version> in Directory.Build.props"
            exit 1
          fi

      - name: Restore
        run: dotnet restore SqlChat.sln

      - name: Build
        run: dotnet build SqlChat.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test SqlChat.sln -c Release --no-build --filter "FullyQualifiedName!~Integration"

      - name: Pack
        run: dotnet pack SqlChat.sln -c Release --no-build -o ./nupkgs

      # Exchanges the OIDC token for a nuget.org API key valid for 1 hour, so request it right before pushing.
      - name: NuGet login (Trusted Publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # .snupkg symbol packages in the same folder are pushed automatically.
      # --skip-duplicate makes a re-run safe if some packages were already published.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "nupkgs/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nupkgs/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
